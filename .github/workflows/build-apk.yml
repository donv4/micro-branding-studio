name: Compile Standalone Android APK Asset
on:
  push:
    branches: [ main ]

jobs:
  compile-android:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-size: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Configure Java JDK 17 Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment Components
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: |
          cd frontend
          npm install
          npm install -g eas-cli

      - name: Run Native Manifest Prebuild Pass
        run: |
          cd frontend
          npx expo prebuild --platform android --clean

      - name: Compile Standalone Release APK Binary
        run: |
          cd frontend/android
          ./gradlew assembleRelease

      - name: Export Shareable Application Package
        uses: actions/upload-artifact@v4
        with:
          name: Micro-Branding-Studio-App
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
